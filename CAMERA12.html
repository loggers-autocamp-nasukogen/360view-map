<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ロガーズオートキャンプ那須高原 360°ビュー (左側エリア)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      touch-action: manipulation;
      font-family: 'M PLUS Rounded 1c', sans-serif;
    }

    /* --- 上部：ナビゲーションエリア --- */
    .top-nav {
      position: fixed;
      top: 12px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0 8px;
      box-sizing: border-box;
      z-index: 100;
    }

    .nav-group-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .nav-btn-sub {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      white-space: nowrap;
    }

    /* 雪景色ボタン */
    #season-toggle {
      background: rgba(255, 255, 255, 0.9);
      color: #333;
    }
    
    .winter-mode-active {
      background: #e3f2fd !important;
      color: #1565c0 !important;
      border: 1px solid #1565c0 !important;
    }

    /* --- 下部中央：メイン予約ボタン（動的にURL変更） --- */
    #reserve-area {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: 85%;
      max-width: 320px;
      display: none; /* 初期は非表示 */
    }

    .btn-reserve-main {
      display: block;
      background: #ff9800;
      color: #fff;
      text-align: center;
      padding: 16px 0;
      border-radius: 50px;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      border: 2px solid #fff;
      transition: transform 0.2s;
    }

    /* カメラ選択メニュー */
    #zone-menu {
      position: fixed;
      top: 60px;
      right: 12px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 10px;
      display: none;
      flex-direction: column;
      gap: 6px;
      z-index: 110;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .zone-btn {
      padding: 12px 16px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      text-align: left;
    }

    .zone-path { background-color: #546e7a; } /* 通路 */
    .zone-site { background-color: #2E7D32; } /* サイト */

  </style>
</head>
  
<body>

  <div class="top-nav">
    <a href="https://loggers-autocamp-nasukogen.github.io/360view-map/" class="nav-btn-sub">
      🔙 MAP
    </a>
    
    <div class="nav-group-right">
      <div class="nav-btn-sub" onclick="toggleMenu()">
        📷 カメラ地点選択
      </div>
      <div id="season-toggle" class="nav-btn-sub" onclick="toggleSeason()">
        ⛄ <span id="season-text">雪景色</span>
      </div>
    </div>
  </div>

  <div id="reserve-area">
    <a id="reserve-link" href="#" target="_blank" class="btn-reserve-main">
      📅 <span id="reserve-text">この区画を予約</span>
    </a>
  </div>

  <div id="zone-menu">
    <button class="zone-btn zone-path" onclick="switchScene('a')">🚶 左側通路 上</button>
    <button class="zone-btn zone-site" onclick="switchScene('b')">⛺ A01サイト</button>
    <button class="zone-btn zone-site" onclick="switchScene('c')">⛺ A02サイト</button>
    <button class="zone-btn zone-site" onclick="switchScene('d')">⛺ A14サイト</button>
    <button class="zone-btn zone-site" onclick="switchScene('e')">⛺ A15サイト</button>
    <button class="zone-btn zone-path" onclick="switchScene('f')">🚶 左側通路 下</button>
  </div>

  <a-scene embedded vr-mode-ui="enabled: false" xr-mode-ui="enabled: false">
    <a-assets>
      <img id="sky-a" src="images/campsiteleftup.webp">
      <img id="sky-b" src="images/A01.webp">
      <img id="sky-c" src="images/A02.webp">
      <img id="sky-d" src="images/A14.webp">
      <img id="sky-e" src="images/A15.webp">
      <img id="sky-f" src="images/campsiteleftunder.webp">
      <img id="sky-a-winter" src="images/campsiteleftup_winter.webp">
    </a-assets>
    <a-sky id="sky" src="#sky-a" rotation="0 -90 0"></a-sky>
    <a-entity id="camera" camera look-controls="smoothingFactor: 0.01" position="0 1.6 0"></a-entity>
  </a-scene>

  <script>
    let isWinter = false;
    let currentZone = 'a';

    // 各サイトの予約URL
    const reserveUrls = {
      'b': 'https://www.nap-camp.com/tochigi/15675/plans/20045886', // A01
      'c': 'https://www.nap-camp.com/tochigi/15675/plans/20045887', // A02
      'd': 'https://www.nap-camp.com/tochigi/15675/plans/20045899', // A14
      'e': 'https://www.nap-camp.com/tochigi/15675/plans/20045900'  // A15
    };

    function toggleMenu() {
      const menu = document.getElementById('zone-menu');
      menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
    }

    function toggleSeason() {
      isWinter = !isWinter;
      const btn = document.getElementById('season-toggle');
      const text = document.getElementById('season-text');
      if (isWinter) {
        btn.classList.add('winter-mode-active');
        text.innerText = "通常表示";
      } else {
        btn.classList.remove('winter-mode-active');
        text.innerText = "雪景色";
      }
      updateScene();
    }

    function switchScene(zone) {
      currentZone = zone;
      document.getElementById('zone-menu').style.display = 'none';
      updateScene();
    }

    function updateScene() {
      const sky = document.querySelector('#sky');
      const reserveArea = document.getElementById('reserve-area');
      const reserveLink = document.getElementById('reserve-link');
      const reserveText = document.getElementById('reserve-text');
      
      let targetSrc = "";
      
      // 画像切り替えロジック
      if (isWinter) {
        // 通路(a)の雪景色、または各サイトの雪景色（命名規則 A01_winter.webp 等を想定）
        targetSrc = (currentZone === 'a') ? "#sky-a-winter" : `images/${getZoneName(currentZone)}_winter.webp`;
      } else {
        targetSrc = `#sky-${currentZone}`;
      }
      
      sky.setAttribute('src', targetSrc);

      // 予約ボタンの表示制御
      if (reserveUrls[currentZone]) {
        reserveArea.style.display = 'block';
        reserveLink.href = reserveUrls[currentZone];
        reserveText.innerText = `${getZoneName(currentZone)}を予約`;
      } else {
        reserveArea.style.display = 'none';
      }
    }

    function getZoneName(zone) {
      const names = { 'b':'A01', 'c':'A02', 'd':'A14', 'e':'A15' };
      return names[zone] || "";
    }
  </script>
</body>
</html>
