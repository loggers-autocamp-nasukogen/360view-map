<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ロガーズオートキャンプ那須高原 360°ビュー (A15)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      touch-action: manipulation;
      font-family: 'M PLUS Rounded 1c', sans-serif;
    }

    /* --- 上部：ナビゲーションエリア --- */
    .top-nav {
      position: fixed;
      top: 12px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0 8px;
      box-sizing: border-box;
      z-index: 100;
    }

    .nav-group-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .nav-btn-sub {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      white-space: nowrap;
    }

    /* 雪景色ボタン */
    #season-toggle {
      background: rgba(255, 255, 255, 0.9);
      color: #333;
    }
    
    .winter-mode-active {
      background: #e3f2fd !important;
      color: #1565c0 !important;
      border: 1px solid #1565c0 !important;
    }

    /* --- 下部中央：メイン予約ボタン --- */
    .bottom-reserve-area {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: 85%;
      max-width: 320px;
    }

    .btn-reserve-main {
      display: block;
      background: #ff9800;
      color: #fff;
      text-align: center;
      padding: 16px 0;
      border-radius: 50px;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      border: 2px solid #fff;
      transition: transform 0.2s;
    }

    .btn-reserve-main:active {
      transform: scale(0.95);
    }

    /* カメラ選択メニュー */
    #zone-menu {
      position: fixed;
      top: 60px;
      right: 12px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 10px;
      display: none;
      flex-direction: column;
      gap: 6px;
      z-index: 110;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .zone-btn {
      padding: 12px 16px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      text-align: left;
    }

    .zone-a { background-color: #2E7D32; }
    .zone-b { background-color: #8D6E63; }
    .zone-c { background-color: #283593; }
    .zone-d { background-color: #BF360C; }
    .zone-e { background-color: #EF6C00; }
    .zone-f { background-color: #00796B; }
  </style>
</head>
  
<body>

  <div class="top-nav">
    <a href="https://loggers-autocamp-nasukogen.github.io/360view-map/" class="nav-btn-sub">
      🔙 MAP
    </a>
    
    <div class="nav-group-right">
      <div class="nav-btn-sub" onclick="toggleMenu()">
        📷 カメラ選択
      </div>
      <div id="season-toggle" class="nav-btn-sub" onclick="toggleSeason()">
        ⛄ <span id="season-text">雪景色</span>
      </div>
    </div>
  </div>

  <div class="bottom-reserve-area">
    <a href="https://www.nap-camp.com/tochigi/15675/plans/20045900" target="_blank" class="btn-reserve-main">
      📅 この区画を予約する
    </a>
  </div>

  <div id="zone-menu">
    <button class="zone-btn zone-a" onclick="switchScene('a')">A15サイト ⛺</button>
    <button class="zone-btn zone-b" onclick="switchScene('b')">センターハウス内</button>
    <button class="zone-btn zone-c" onclick="switchScene('c')">センターハウス前</button>
    <button class="zone-btn zone-d" onclick="switchScene('d')">こかげの公園</button>
    <button class="zone-btn zone-e" onclick="switchScene('e')">シャワー室</button>
    <button class="zone-btn zone-f" onclick="switchScene('f')">炊事場</button>
  </div>

  <a-scene embedded vr-mode-ui="enabled: false" xr-mode-ui="enabled: false">
    <a-assets>
      <img id="sky-a" src="images/A15.webp">
      <img id="sky-b" src="images/centerhouse1.webp">
      <img id="sky-c" src="images/front_centerhouse2.webp">
      <img id="sky-d" src="images/shaded_park3.webp">
      <img id="sky-e" src="images/shower_room1.webp">
      <img id="sky-f" src="images/kitchen.webp">
    </a-assets>
    <a-sky id="sky" src="#sky-a" rotation="0 -90 0"></a-sky>
    <a-entity id="camera" camera look-controls="smoothingFactor: 0.01" position="0 1.6 0"></a-entity>
  </a-scene>

  <script>
    let isWinter = false;
    let currentZone = 'a';

    function toggleMenu() {
      const menu = document.getElementById('zone-menu');
      menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
    }

    function toggleSeason() {
      isWinter = !isWinter;
      const btn = document.getElementById('season-toggle');
      const text = document.getElementById('season-text');

      if (isWinter) {
        btn.classList.add('winter-mode-active');
        text.innerText = "通常表示";
        currentZone = 'a'; // 雪景色はA15視点へ強制移動
      } else {
        btn.classList.remove('winter-mode-active');
        text.innerText = "雪景色";
      }
      updateScene();
    }

    function switchScene(zone) {
      currentZone = zone;
      // 雪景色がない視点に切り替えたら通常モードに戻す
      if (isWinter && zone !== 'a') {
        isWinter = false;
        const btn = document.getElementById('season-toggle');
        const text = document.getElementById('season-text');
        btn.classList.remove('winter-mode-active');
        text.innerText = "雪景色";
      }
      document.getElementById('zone-menu').style.display = 'none';
      updateScene();
    }

    function updateScene() {
      const sky = document.querySelector('#sky');
      let targetSrc = "";

      if (isWinter && currentZone === 'a') {
        targetSrc = "images/A15_winter.webp";
      } else {
        switch (currentZone) {
          case 'a': targetSrc = "#sky-a"; break;
          case 'b': targetSrc = "#sky-b"; break;
          case 'c': targetSrc = "#sky-c"; break;
          case 'd': targetSrc = "#sky-d"; break;
          case 'e': targetSrc = "#sky-e"; break;
          case 'f': targetSrc = "#sky-f"; break;
        }
      }
      sky.setAttribute('src', targetSrc);
    }

    function goBack() {
      window.location.href = "https://loggers-autocamp-nasukogen.github.io/360view-map/";
    }
  </script>
</body>
</html>
