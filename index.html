@keyframes blinkCam {

 animation: twinkle 2s infinite;

/* 🎃🐱👻 共通の揺れ演出（揺れ＋インターバル付き） */
.pumpkin-shake {
  animation: shakePumpkin 1.2s infinite ease-in-out;
  transform-origin: center;
}

@keyframes shakePumpkin {
  0%   { transform: rotate(0deg); }
  10%  { transform: rotate(1deg); }
  20%  { transform: rotate(-1deg); }
  30%  { transform: rotate(0.5deg); }
  40%  { transform: rotate(-0.5deg); }
  50%  { transform: rotate(0deg); }
  100% { transform: rotate(0deg); } /* インターバル：50%〜100%は静止状態 */
}


/* 🎃🐱👻 共通の揺れ演出（逆パターン） */
.pumpkin-shake-reverse {
  animation: shakePumpkinReverse 1.2s infinite ease-in-out;
  transform-origin: center;
}

@keyframes shakePumpkinReverse {
  0%   { transform: rotate(0deg); } /* 静止開始 */
  50%  { transform: rotate(0deg); } /* インターバル：0〜50%は静止状態 */
  60%  { transform: rotate(1deg); }
  70%  { transform: rotate(-1deg); }
  80%  { transform: rotate(0.5deg); }
  90%  { transform: rotate(-0.5deg); }
  100% { transform: rotate(0deg); } /* 揺れ終了 */
}

        /* 🎅 クリスマス演出用 */
@keyframes xmasShake {
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-6px) rotate(2deg); }
}

@keyframes xmasShakeReverse {
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(6px) rotate(-2deg); }
}

.xmas-shake,
.xmas-shake-reverse {
  animation-duration: 3s;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
  transform-origin: center;
}

.xmas-shake { animation-name: xmasShake; }
.xmas-shake-reverse { animation-name: xmasShakeReverse; }

<div id="back-to-nap" role="button" tabindex="0" onclick="goToNap()">📅 なっぷで予約</div>

<script>
function goToNap() {
  window.location.href = "https://www.nap-camp.com/tochigi/15675?status=1005";
}

const today = new Date();
const month = today.getMonth(); // 0 = Jan, 10 = Nov, 11 = Dec
const date = today.getDate();

// 🎃 ハロウィン期間：9月25日〜10月31日
const isHalloween =
  (month === 8 && date >= 25) || // 9月25日〜30日
  (month === 9);                 // 10月

// 🎄 クリスマス期間：11月13日〜12月25日
const isChristmas =
  (month === 10 && date >= 13) || // 11月13日〜30日
  (month === 11 && date <= 25);   // 12月1日〜25日

// 🎃 ハロウィン演出制御
const ghostGroups = document.getElementsByClassName("ghostGroup");
for (let i = 0; i < ghostGroups.length; i++) {
  ghostGroups[i].style.display = isHalloween ? "inline" : "none";
}

const hwElements = {
  bird:     document.getElementById("birdGroup"),
  ghost2:   document.getElementById("ghost2Group"),
  witch:    document.getElementById("witchGroup"),
  stars:    document.getElementById("witchStars"),
  pumpkin:  document.getElementById("pumpkinGroup"),
  cat:      document.getElementById("catGroup"),
  banner:   document.querySelector(".hw-banner")
};

const xmasElements = {
  santaFlying:  document.getElementById("santaGroup"), // 🎅 空を滑空するサンタ
  deer:         document.getElementById("deerGroup"),
  santaGreen:   document.getElementById("santaGreenGroup"),
  santaOrange:  document.getElementById("santaOrangeGroup"),
  santaPink:    document.getElementById("santaPinkGroup"),
  santaSkyblue: document.getElementById("santaSkyblueGroup"),
  santaKing:    document.getElementById("santaKingGroup"),
  santaQueen:   document.getElementById("santaQueenGroup"),
  banner:       document.querySelector(".xmas-banner")
};

// 🎃 ハロウィン表示
if (isHalloween) {
  if (hwElements.bird)    hwElements.bird.style.display = "none";
  if (hwElements.ghost2)  hwElements.ghost2.style.display = "inline";
  if (hwElements.witch)   hwElements.witch.style.display = "inline";
  if (hwElements.stars)   hwElements.stars.style.display = "inline";
  if (hwElements.pumpkin) hwElements.pumpkin.style.display = "inline";
  if (hwElements.cat)     hwElements.cat.style.display = "inline";
  if (hwElements.banner)  hwElements.banner.style.display = "block";
} else {
  if (hwElements.bird)    hwElements.bird.style.display = "inline";
  if (hwElements.ghost2)  hwElements.ghost2.style.display = "none";
  if (hwElements.witch)   hwElements.witch.style.display = "none";
  if (hwElements.stars)   hwElements.stars.style.display = "none";
  if (hwElements.pumpkin) hwElements.pumpkin.style.display = "none";
  if (hwElements.cat)     hwElements.cat.style.display = "none";
  if (hwElements.banner)  hwElements.banner.style.display = "none";
}

// 🎄 クリスマス表示
if (isChristmas) {
  for (const key in xmasElements) {
    if (xmasElements[key]) xmasElements[key].style.display = key === "banner" ? "block" : "inline";
  }
} else {
  for (const key in xmasElements) {
    if (xmasElements[key]) xmasElements[key].style.display = "none";
  }
}
</script>
