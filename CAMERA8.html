<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ロガーズオートキャンプ那須高原 360°ビュー (A10付近)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      touch-action: manipulation;
      font-family: 'M PLUS Rounded 1c', sans-serif;
    }

    /* --- 上部：ナビゲーションエリア --- */
    .top-nav {
      position: fixed;
      top: 12px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0 8px;
      box-sizing: border-box;
      z-index: 100;
    }

    .nav-group-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .nav-btn-sub {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      white-space: nowrap;
    }

    #season-toggle { background: rgba(255, 255, 255, 0.9); color: #333; }
    .winter-mode-active { background: #e3f2fd !important; color: #1565c0 !important; border: 1px solid #1565c0 !important; }

    /* --- 下部中央：予約ボタン --- */
    #reserve-area {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: 85%;
      max-width: 320px;
      display: none;
    }

    .btn-reserve-main {
      display: block;
      background: #ff9800;
      color: #fff;
      text-align: center;
      padding: 16px 0;
      border-radius: 50px;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      border: 2px solid #fff;
    }

    /* カメラ選択メニュー */
    #zone-menu {
      position: fixed;
      top: 60px;
      right: 12px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 10px;
      display: none;
      flex-direction: column;
      gap: 6px;
      z-index: 110;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .zone-btn { padding: 12px 16px; font-size: 14px; font-weight: bold; border: none; border-radius: 8px; color: #fff; cursor: pointer; text-align: left; }
    .zone-path { background-color: #546e7a; }
    .zone-site { background-color: #2E7D32; }
  </style>
</head>
  
<body>

  <div class="top-nav">
    <a href="https://loggers-autocamp-nasukogen.github.io/360view-map/" class="nav-btn-sub">🔙 MAP</a>
    <div class="nav-group-right">
      <div class="nav-btn-sub" onclick="toggleMenu()">📷 地点選択</div>
      <div id="season-toggle" class="nav-btn-sub" onclick="toggleSeason()">⛄ <span id="season-text">雪景色</span></div>
    </div>
  </div>

  <div id="reserve-area">
    <a id="reserve-link" href="#" target="_blank" class="btn-reserve-main">
      📅 <span id="reserve-text">予約する</span>
    </a>
  </div>

  <div id="zone-menu">
    <button class="zone-btn zone-path" onclick="switchScene('a')">🚶 A10前通路</button>
    <button class="zone-btn zone-site" onclick="switchScene('b')">⛺ A08サイト</button>
    <button class="zone-btn zone-site" onclick="switchScene('c')">⛺ A09サイト</button>
    <button class="zone-btn zone-site" onclick="switchScene('d')">⛺ A10サイト</button>
    <button class="zone-btn zone-site" onclick="switchScene('e')">⛺ A11サイト</button>
    <button class="zone-btn zone-site" onclick="switchScene('f')">⛺ A17サイト</button>
  </div>

  <a-scene embedded vr-mode-ui="enabled: false" xr-mode-ui="enabled: false">
    <a-assets>
      <img id="sky-a" src="images/right_campsite.webp">
      <img id="sky-b" src="images/A08.webp">
      <img id="sky-c" src="images/A09.webp">
      <img id="sky-d" src="images/A10.webp">
      <img id="sky-e" src="images/A11.webp">
      <img id="sky-f" src="images/A17.webp">
    </a-assets>
    <a-sky id="sky" src="#sky-a" rotation="0 -90 0"></a-sky>
    <a-entity id="camera" camera look-controls="smoothingFactor: 0.01" position="0 1.6 0"></a-entity>
  </a-scene>

  <script>
    let isWinter = false;
    let currentZone = 'a';

    const reserveUrls = {
      'b': 'https://www.nap-camp.com/tochigi/15675/plans/20045893', // A08
      'c': 'https://www.nap-camp.com/tochigi/15675/plans/20045894', // A09
      'd': 'https://www.nap-camp.com/tochigi/15675/plans/20045895', // A10
      'e': 'https://www.nap-camp.com/tochigi/15675/plans/20045896', // A11
      'f': 'https://www.nap-camp.com/tochigi/15675/plans/20045902'  // A17
    };

    const zoneFiles = { 'a':'right_campsite', 'b':'A08', 'c':'A09', 'd':'A10', 'e':'A11', 'f':'A17' };

    function toggleMenu() {
      const menu = document.getElementById('zone-menu');
      menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
    }

    function toggleSeason() {
      isWinter = !isWinter;
      const btn = document.getElementById('season-toggle');
      const text = document.getElementById('season-text');
      btn.classList.toggle('winter-mode-active');
      text.innerText = isWinter ? "通常表示" : "雪景色";
      updateScene();
    }

    function switchScene(zone) {
      currentZone = zone;
      document.getElementById('zone-menu').style.display = 'none';
      updateScene();
    }

    function updateScene() {
      const sky = document.querySelector('#sky');
      const reserveArea = document.getElementById('reserve-area');
      const reserveLink = document.getElementById('reserve-link');
      const reserveText = document.getElementById('reserve-text');
      
      let fileName = zoneFiles[currentZone];
      let targetSrc = isWinter ? `images/${fileName}_winter.webp` : `#sky-${currentZone}`;
      
      sky.setAttribute('src', targetSrc);

      if (reserveUrls[currentZone]) {
        reserveArea.style.display = 'block';
        reserveLink.href = reserveUrls[currentZone];
        reserveText.innerText = `${fileName}を予約`;
      } else {
        reserveArea.style.display = 'none';
      }
    }
  </script>
</body>
</html>
