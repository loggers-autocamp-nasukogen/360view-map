<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ロガーズオートキャンプ那須高原 360°ビュー (B06)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      touch-action: manipulation;
      font-family: 'M PLUS Rounded 1c', sans-serif;
    }

    /* --- 上部：ナビゲーションエリア --- */
    .top-nav {
      position: fixed;
      top: 12px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0 8px;
      box-sizing: border-box;
      z-index: 100;
    }

    .nav-group-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .nav-btn-sub {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      white-space: nowrap;
    }

    #view-toggle {
      margin-top: 8px;
      background: rgba(255, 255, 255, 0.9);
      color: #333;
      border: 1px solid #ddd;
      transition: opacity 0.3s;
    }
    
    .up-view-active {
      background: #e3f2fd !important;
      color: #1565c0 !important;
      border: 1px solid #1565c0 !important;
    }

    /* --- 下部中央：メイン予約ボタン --- */
    .bottom-reserve-area {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: 85%;
      max-width: 320px;
    }

    .btn-reserve-main {
      display: block;
      background: #ff9800;
      color: #fff;
      text-align: center;
      padding: 16px 0;
      border-radius: 50px;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      border: 2px solid #fff;
      transition: transform 0.2s;
    }

    .btn-reserve-main:active {
      transform: scale(0.95);
    }

    /* カメラ選択メニュー */
    #zone-menu {
      position: fixed;
      top: 65px;
      right: 12px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 10px;
      display: none;
      flex-direction: column;
      gap: 6px;
      z-index: 110;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .zone-btn {
      padding: 12px 16px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      text-align: left;
    }

    .zone-b6 { background-color: #8D6E63; }
    .zone-ch { background-color: #2E7D32; }
    .zone-pr { background-color: #283593; }
    .zone-sh { background-color: #EF6C00; }

    @media screen and (max-width: 480px) {
      .btn-reserve-main { font-size: 17px; padding: 14px 0; }
    }
  </style>
</head>
  
<body>

<div class="top-nav">
    <a href="https://loggers-autocamp-nasukogen.github.io/360view-map/" class="nav-btn-sub">
      🔙 MAP
    </a>
    
    <div class="nav-group-right">
      <div class="nav-btn-sub" onclick="toggleMenu()">
        📷 カメラ選択
      </div>
      <div id="view-toggle" class="nav-btn-sub" onclick="toggleView()">
        👀 <span id="view-text">上空視点</span>
      </div>
    </div>
  </div>

  <div class="bottom-reserve-area">
    <a href="https://www.nap-camp.com/tochigi/15675/plans/20050599" target="_blank" class="btn-reserve-main">
      📅 この区画を予約する
    </a>
  </div>

  <div id="zone-menu">
    <button class="zone-btn zone-b6" onclick="switchScene('b6')">B06サイト ⛺</button>
    <button class="zone-btn zone-ch" onclick="switchScene('ch_in')">センターハウス内</button>
    <button class="zone-btn zone-ch" onclick="switchScene('ch_front')">センターハウス前</button>
    <button class="zone-btn zone-pr" onclick="switchScene('park')">こかげの公園</button>
    <button class="zone-btn zone-sh" onclick="switchScene('shower')">シャワー室・炊事場</button>
  </div>

  <a-scene embedded vr-mode-ui="enabled: false" xr-mode-ui="enabled: false">
    <a-assets>
      <img id="sky-b06" src="images/B06.webp">
      <img id="sky-b06-up" src="images/B06-up.webp">
      <img id="sky-ch-in" src="images/centerhouse1.webp">
      <img id="sky-ch-front" src="images/front_centerhouse2.webp">
      <img id="sky-park" src="images/shaded_park3.webp">
      <img id="sky-facility" src="images/shower_room1.webp">
    </a-assets>
    <a-sky id="sky" src="#sky-b06" rotation="0 -90 0"></a-sky>
    <a-entity id="camera" camera look-controls="smoothingFactor: 0.01" position="0 1.6 0"></a-entity>
  </a-scene>

  <script>
    let isUpView = false;
    let currentZone = 'b6';

    function toggleMenu() {
      const menu = document.getElementById('zone-menu');
      menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
    }

    function toggleView() {
      if (currentZone !== 'b6') return;

      isUpView = !isUpView;
      const btn = document.getElementById('view-toggle');
      const text = document.getElementById('view-text');

      if (isUpView) {
        btn.classList.add('up-view-active');
        text.innerText = "通常視点";
      } else {
        btn.classList.remove('up-view-active');
        text.innerText = "上空視点";
      }
      updateScene();
    }

    function switchScene(zone) {
      currentZone = zone;
      const btn = document.getElementById('view-toggle');
      const text = document.getElementById('view-text');

      if (zone !== 'b6') {
        isUpView = false;
        btn.classList.remove('up-view-active');
        text.innerText = "上空視点";
        btn.style.opacity = "0.5";
        btn.style.pointerEvents = "none";
      } else {
        btn.style.opacity = "1";
        btn.style.pointerEvents = "auto";
      }

      document.getElementById('zone-menu').style.display = 'none';
      updateScene();
    }

    function updateScene() {
      const sky = document.querySelector('#sky');
      let targetSrc = "";

      switch (currentZone) {
        case 'b6':
          targetSrc = isUpView ? "#sky-b06-up" : "#sky-b06";
          break;
        case 'ch_in': targetSrc = "#sky-ch-in"; break;
        case 'ch_front': targetSrc = "#sky-ch-front"; break;
        case 'park': targetSrc = "#sky-park"; break;
        case 'shower': targetSrc = "#sky-facility"; break;
      }
      
      sky.setAttribute('src', targetSrc);
    }

    window.onload = function() {
      switchScene(currentZone);
    };
  </script>
</body>
</html>
